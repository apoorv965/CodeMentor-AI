# CodeMentor AI Render Blueprint
# Deploy from the repository root. Add MongoDB Atlas and Gemini values in Render
# when prompted for sync:false variables.
previews:
  generation: automatic

services:
  - type: web
    name: codementor-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PERSISTENCE_MODE
        value: mongo
      - key: EXECUTION_MODE
        value: disabled
      - key: ALLOW_UNSANDBOXED_EXECUTION
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://codementor-web.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: EXECUTE_RATE_LIMIT_MAX
        value: 10
      - key: MENTOR_RATE_LIMIT_MAX
        value: 15
      - key: SUBMIT_RATE_LIMIT_MAX
        value: 10
      - key: EXECUTION_TIMEOUT_MS
        value: 10000
      - key: MAX_CODE_LENGTH
        value: 20000
      - key: MAX_INPUT_LENGTH
        value: 5000
      - key: MAX_OUTPUT_LENGTH
        value: 20000

  - type: web
    name: codementor-web
    runtime: node
    rootDir: frontend
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: BACKEND_URL
        value: https://codementor-api.onrender.com
