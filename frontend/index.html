<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="google-adsense-account" content="ca-pub-3482537894700896">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CodeMentor AI — an enterprise-grade coding practice workspace with real execution, judging, and guided feedback." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='11' fill='%23121a27' stroke='%238b7cff' stroke-width='2'/%3E%3Cpath d='M15 12 9.5 20l5.5 8M25 12l5.5 8-5.5 8' fill='none' stroke='%2338d6b3' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='m20 11 1.4 5.6L27 18l-5.6 1.4L20 25l-1.4-5.6L13 18l5.6-1.4L20 11Z' fill='%23f7c65b'/%3E%3C/svg%3E" />
  <title>CodeMentor AI | Coding workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0e1116;
      --panel: #161b22;
      --line: #262c36;
      --paper: #e8eaed;
      --muted: #8b94a3;
      --signal: #7c5cff;
      --signal2: #37e2c4;
      --warn: #ff8a5c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    ::selection {
      background: var(--signal);
      color: var(--ink);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .muted {
      color: var(--muted);
    }

    .signal {
      color: var(--signal);
    }

    .signal2 {
      color: var(--signal2);
    }

    .warn {
      color: var(--warn);
    }

    .text-glow {
      text-shadow: 0 0 24px rgba(124, 92, 255, .35);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      font-weight: 500;
      border-radius: 8px;
      padding: .65rem 1.3rem;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: .9rem;
      transition: opacity .15s, border-color .15s, color .15s;
      font-family: inherit;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--signal);
      color: var(--ink);
    }

    .btn-primary:hover:not(:disabled) {
      opacity: .88;
    }

    .btn-ghost {
      background: transparent;
      color: var(--paper);
      border-color: var(--line);
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--signal);
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--paper);
      border-color: var(--line);
    }

    .btn-danger-ghost:hover:not(:disabled) {
      border-color: var(--warn);
      color: var(--warn);
    }

    input,
    select,
    textarea {
      font-family: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--paper);
      border-radius: 8px;
      padding: .55rem .75rem;
      font-size: .9rem;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--signal);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .container-sm {
      max-width: 420px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .container-md {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Nav */
    header.nav {
      border-bottom: 1px solid var(--line);
      background: rgba(14, 17, 22, .95);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -.02em;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      font-size: .88rem;
    }

    .nav-links a {
      color: var(--muted);
      transition: color .15s;
      cursor: pointer;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--paper);
    }

    .nav-right {
      display: flex;
      gap: .75rem;
      align-items: center;
    }

    @media (max-width:720px) {
      .nav-links {
        display: none;
      }
    }

    /* Landing */
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      padding: 4.5rem 0 3.5rem;
    }

    @media (min-width:860px) {
      .hero {
        grid-template-columns: 1fr 1fr;
        align-items: center;
      }
    }

    .hero h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.3rem;
      line-height: 1.15;
      font-weight: 700;
      margin: 1rem 0;
    }

    @media (min-width:640px) {
      .hero h1 {
        font-size: 2.9rem;
      }
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      color: var(--signal);
      margin: 0;
    }

    .hero p.lead {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
      max-width: 32rem;
      margin-top: 1.2rem;
    }

    .hero .cta-row {
      display: flex;
      gap: 1rem;
      margin-top: 1.8rem;
      flex-wrap: wrap;
    }

    .code-panel {
      padding: 1.2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .82rem;
      overflow-x: auto;
    }

    .dots {
      display: flex;
      gap: .4rem;
      margin-bottom: 1rem;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .code-row {
      position: relative;
    }

    .code-line {
      white-space: pre;
      padding: .1rem 0;
      color: var(--paper);
    }

    .line-no {
      color: var(--muted);
      user-select: none;
      margin-right: .9rem;
    }

    .code-note {
      margin-left: 2.1rem;
      margin-bottom: .5rem;
      margin-top: .25rem;
      color: var(--signal2);
      font-size: .72rem;
      border-left: 2px solid rgba(55, 226, 196, .4);
      padding: .3rem .7rem;
      background: rgba(55, 226, 196, .05);
    }

    .features {
      padding: 3.5rem 0;
      border-top: 1px solid var(--line);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width:720px) {
      .feature-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .feature-grid .card {
      padding: 1.5rem;
    }

    .feature-grid h3 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      margin: .5rem 0 .4rem;
    }

    .feature-grid p {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.6;
      margin: 0;
    }

    .cta-section {
      padding: 3.5rem 0;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .cta-section h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    /* Forms */
    .form-page {
      padding: 5rem 0;
    }

    .form-page h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      margin-bottom: .25rem;
    }

    .form-page .sub {
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 1.8rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: .3rem;
    }

    .field input {
      width: 100%;
    }

    .form-err {
      color: var(--warn);
      font-size: .85rem;
      margin-bottom: .5rem;
    }

    .form-page button[type=submit] {
      width: 100%;
    }

    .form-foot {
      color: var(--muted);
      font-size: .85rem;
      margin-top: 1.3rem;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: .8rem;
      color: var(--muted);
      font-size: .78rem;
      margin: 0 0 1.1rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* Dashboard */
    .page {
      padding: 2.8rem 0;
    }

    .page h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      margin-bottom: .25rem;
    }

    .page .sub {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: .92rem;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2.2rem;
    }

    @media (min-width:640px) {
      .stat-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .stat-grid .card {
      padding: 1.4rem;
    }

    .stat-grid .card p:first-child {
      color: var(--muted);
      font-size: .85rem;
      margin: 0;
    }

    .stat-grid .card p.val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.9rem;
      font-weight: 700;
      margin: .3rem 0 0;
    }

    /* Practice */
    .problem-row {
      padding: 1.1rem 1.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .75rem;
      cursor: pointer;
      transition: border-color .15s;
    }

    .problem-row:hover {
      border-color: var(--signal);
    }

    .problem-row h3 {
      margin: 0 0 .35rem;
      font-weight: 500;
    }

    .tag-row {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
    }

    .tag {
      font-size: .72rem;
      color: var(--muted);
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: .15rem .5rem;
    }

    .diff {
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      white-space: nowrap;
      margin-left: 1rem;
    }

    .diff-easy {
      color: var(--lc-easy, var(--signal2));
    }

    .diff-medium {
      color: var(--lc-medium, var(--warn));
    }

    .diff-hard {
      color: var(--lc-hard, var(--warn));
    }

    .solved-badge {
      font-size: .72rem;
      color: var(--signal2);
      border: 1px solid rgba(55, 226, 196, .4);
      border-radius: 5px;
      padding: .15rem .5rem;
      margin-left: .5rem;
    }

    /* Editor (scratchpad) */
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.2rem;
    }

    @media (min-width:980px) {
      .editor-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .editor-wrap {
      position: relative;
      overflow: hidden;
    }

    .editor-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .6rem .8rem;
      border-bottom: 1px solid var(--line);
    }

    textarea.code-input {
      width: 100%;
      height: 440px;
      resize: vertical;
      border: none;
      border-radius: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      line-height: 1.55;
      padding: 1rem;
      background: var(--panel);
      tab-size: 4;
    }

    .mentor-panel {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
    }

    .tab-row {
      display: flex;
      gap: .4rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 500;
      padding: .45rem .8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--signal);
      color: var(--ink);
    }

    .tab-btn:not(.active):hover {
      color: var(--paper);
    }

    .mentor-body {
      flex: 1;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      line-height: 1.6;
      max-height: 420px;
    }

    .mentor-body p {
      white-space: pre-wrap;
      margin: 0 0 .8rem;
    }

    .fix-block {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .8rem;
      white-space: pre-wrap;
      overflow-x: auto;
      margin-top: .4rem;
    }

    .status-dot {
      font-size: .85rem;
      margin-bottom: .6rem;
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(124, 92, 255, .25);
      border-top-color: var(--signal);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: .5rem;
      vertical-align: -2px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .run-output {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .7rem;
      margin-top: .8rem;
      font-size: .78rem;
      max-height: 150px;
      overflow: auto;
      white-space: pre-wrap;
    }

    /* Profile */
    .kv {
      margin-bottom: 1rem;
    }

    .kv .k {
      color: var(--muted);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .2rem;
    }

    .kv .v {
      font-family: 'JetBrains Mono', monospace;
      font-size: .9rem;
    }

    footer.site {
      border-top: 1px solid var(--line);
      padding: 2rem 0;
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
    }

    .toast {
      position: fixed;
      bottom: 1.2rem;
      right: 1.2rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--signal2);
      border-radius: 8px;
      padding: .8rem 1.1rem;
      font-size: .85rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
      z-index: 200;
      max-width: 320px;
    }

    .toast.err {
      border-left-color: var(--warn);
    }

    /* ================= LeetCode-style problem workspace ================= */
    :root {
      --lc-orange: #ffa116;
      --lc-easy: #00af9b;
      --lc-medium: #ffc01e;
      --lc-hard: #ff375f;
      --lc-bg: #0e1116;
      --lc-panel2: #1d222b;
      --lc-line2: #2a3140;
    }

    .lc-shell {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 65px);
      background: var(--lc-bg);
    }

    .lc-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .7rem 1.2rem;
      border-bottom: 1px solid var(--lc-line2);
      flex-wrap: wrap;
      gap: .7rem;
      background: var(--panel);
    }

    .lc-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: .92rem;
      display: flex;
      align-items: center;
      gap: .7rem;
      flex-wrap: wrap;
    }

    .lc-back {
      font-size: .8rem;
      color: var(--muted);
      cursor: pointer;
    }

    .lc-back:hover {
      color: var(--paper);
    }

    .lc-pill {
      font-size: .7rem;
      padding: .2rem .6rem;
      border-radius: 999px;
      font-family: 'JetBrains Mono', monospace;
      text-transform: capitalize;
    }

    .lc-pill.easy {
      color: var(--lc-easy);
      background: rgba(0, 175, 155, .12);
    }

    .lc-pill.medium {
      color: var(--lc-medium);
      background: rgba(255, 192, 30, .12);
    }

    .lc-pill.hard {
      color: var(--lc-hard);
      background: rgba(255, 55, 95, .12);
    }

    .lc-run-row {
      display: flex;
      gap: .55rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .lc-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      padding: .5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--lc-line2);
      background: var(--lc-panel2);
      color: var(--paper);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      transition: border-color .15s, color .15s, opacity .15s;
    }

    .lc-btn:hover:not(:disabled) {
      border-color: var(--lc-orange);
      color: var(--lc-orange);
    }

    .lc-btn.submit {
      background: var(--lc-orange);
      color: #14110a;
      border-color: var(--lc-orange);
      font-weight: 700;
    }

    .lc-btn.submit:hover:not(:disabled) {
      opacity: .88;
      color: #14110a;
    }

    .lc-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .lc-body {
      flex: 1;
      display: flex;
      min-height: 0;
      padding: .6rem;
      gap: 0;
    }

    .lc-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      overflow: hidden;
    }

    .lc-right {
      flex-direction: column;
    }

    .lc-splitter-v {
      width: 10px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      position: relative;
    }

    .lc-splitter-v::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--lc-line2);
      transform: translateX(-50%);
    }

    .lc-splitter-v:hover::after,
    .lc-splitter-v.dragging::after {
      background: var(--lc-orange);
    }

    .lc-splitter-h {
      height: 10px;
      cursor: row-resize;
      background: transparent;
      flex-shrink: 0;
      position: relative;
    }

    .lc-splitter-h::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--lc-line2);
      transform: translateY(-50%);
    }

    .lc-splitter-h:hover::after,
    .lc-splitter-h.dragging::after {
      background: var(--lc-orange);
    }

    .lc-tabbar {
      display: flex;
      gap: .2rem;
      padding: .5rem .6rem;
      border-bottom: 1px solid var(--lc-line2);
      flex-shrink: 0;
    }

    .lc-tab {
      font-family: 'JetBrains Mono', monospace;
      font-size: .76rem;
      padding: .4rem .8rem;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
    }

    .lc-tab.active {
      background: var(--lc-panel2);
      color: var(--paper);
    }

    .lc-tab:hover:not(.active) {
      color: var(--paper);
    }

    .lc-tab.warn {
      color: var(--warn);
    }

    .lc-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1.3rem 1.4rem;
      font-size: .9rem;
      line-height: 1.65;
    }

    .lc-scroll h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      margin: .2rem 0 .9rem;
    }

    .lc-scroll p {
      color: var(--muted);
      margin: 0 0 1rem;
    }

    .lc-tag-row {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .lc-editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .55rem .9rem;
      border-bottom: 1px solid var(--lc-line2);
      flex-shrink: 0;
    }

    .lc-console-tabs {
      display: flex;
      gap: .3rem;
      padding: .5rem .6rem;
      border-bottom: 1px solid var(--lc-line2);
      flex-shrink: 0;
    }

    .lc-case-row {
      display: flex;
      gap: .4rem;
      padding: .7rem .8rem 0;
      flex-wrap: wrap;
    }

    .lc-case-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: .73rem;
      padding: .35rem .8rem;
      border-radius: 6px;
      border: 1px solid var(--lc-line2);
      background: var(--lc-panel2);
      color: var(--muted);
      cursor: pointer;
    }

    .lc-case-btn.active {
      color: var(--paper);
      border-color: var(--lc-orange);
    }

    .lc-case-btn.warn {
      color: var(--warn);
      border-color: rgba(255, 138, 92, .4);
    }

    .lc-case-body {
      padding: .6rem .8rem 1rem;
      overflow-y: auto;
      flex: 1;
    }

    .lc-case-label {
      font-size: .7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin: .7rem 0 .35rem;
    }

    .lc-case-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: .82rem;
      background: var(--lc-panel2);
      border: 1px solid var(--lc-line2);
      border-radius: 6px;
      padding: .6rem .75rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .lc-result-summary {
      font-family: 'JetBrains Mono', monospace;
      font-size: .95rem;
      font-weight: 700;
      padding: .9rem .9rem 0;
    }

    textarea.lc-code-input {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      border-radius: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      line-height: 1.55;
      padding: 1rem;
      background: var(--panel);
      tab-size: 4;
    }

    @media (max-width:860px) {
      .lc-body {
        flex-direction: column;
      }

      .lc-splitter-v {
        display: none;
      }

      .lc-left {
        flex-basis: auto !important;
        max-height: 42vh;
      }

      .lc-right {
        flex: 1;
      }
    }

    /* ---- LeetCode-style practice list ---- */
    .lc-list-wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    .lc-progress-row {
      display: flex;
      align-items: center;
      gap: .9rem;
      margin-bottom: 1.5rem;
    }

    /* ---- Landing ---- */
    .section-head { max-width: 44rem; margin: 0 0 2rem; }
    .section-head h2 { font-family: 'JetBrains Mono', monospace; font-size: 1.7rem; line-height: 1.2; margin: 0 0 .6rem; }
    .section-head p { color: var(--muted); margin: 0; line-height: 1.6; max-width: 38rem; }
    .land-section { padding: 3.5rem 0; border-top: 1px solid var(--line); }

    .land-stats { display: flex; flex-wrap: wrap; gap: 2.5rem; margin-top: 2.5rem; }
    .land-stat b { display: block; font-family: 'JetBrains Mono', monospace; font-size: 1.45rem; color: var(--signal2); }
    .land-stat span { color: var(--muted); font-size: .85rem; }

    .ladder { display: grid; gap: 1.25rem; }
    @media (min-width:860px) { .ladder { grid-template-columns: 340px 1fr; align-items: start; } }
    .ladder-context { padding: 1.1rem 1.2rem; font-family: 'JetBrains Mono', monospace; font-size: .78rem; line-height: 1.7; }
    .ladder-context .fail { color: #ff8a5c; }
    .ladder-tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .9rem; }
    .ladder-tab {
      padding: .45rem .9rem; border-radius: 999px; border: 1px solid var(--line);
      background: transparent; color: inherit; font: inherit; font-size: .85rem; cursor: pointer;
    }
    .ladder-tab.active { border-color: var(--signal); background: rgba(124, 92, 255, .14); }
    .ladder-body { padding: 1.4rem; min-height: 9rem; }
    .ladder-body p { margin: 0 0 .9rem; line-height: 1.7; }
    .ladder-body .why { color: var(--muted); font-size: .88rem; border-top: 1px solid var(--line); padding-top: .8rem; margin: 0; }

    .flow { display: grid; gap: 1rem; counter-reset: step; }
    @media (min-width:760px) { .flow { grid-template-columns: repeat(4, 1fr); } }
    .flow-step { padding: 1.2rem; }
    .flow-step b { font-family: 'JetBrains Mono', monospace; color: var(--signal); font-size: .8rem; }
    .flow-step h4 { margin: .5rem 0 .4rem; font-size: .98rem; }
    .flow-step p { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.6; }

    .contrast-grid { display: grid; gap: 1.25rem; }
    @media (min-width:760px) { .contrast-grid { grid-template-columns: 1fr 1fr; } }
    .contrast { padding: 1.5rem; }
    .contrast h4 { margin: 0 0 1rem; font-size: 1rem; }
    .contrast ul { margin: 0; padding-left: 1.1rem; color: var(--muted); line-height: 1.8; font-size: .92rem; }
    .contrast.good { border-color: rgba(55, 226, 196, .4); }

    .land-topics { display: flex; flex-wrap: wrap; gap: .6rem; }

    .faq-item { border-top: 1px solid var(--line); padding: 1.1rem 0; }
    .faq-item:last-child { border-bottom: 1px solid var(--line); }
    .faq-item summary { cursor: pointer; font-weight: 600; list-style: none; }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary::after { content: "+"; float: right; color: var(--signal); }
    .faq-item[open] summary::after { content: "–"; }
    .faq-item p { color: var(--muted); line-height: 1.7; margin: .8rem 0 0; max-width: 46rem; }

    .land-foot { border-top: 1px solid var(--line); padding: 2rem 0 3rem; color: var(--muted); font-size: .85rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

    /* ---- Topics ---- */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1rem;
    }
    .topic-card {
      text-align: left;
      background: var(--panel, rgba(255,255,255,.03));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }
    .topic-card:hover { transform: translateY(-2px); border-color: var(--signal, #7c5cff); }
    .topic-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
    .topic-card-top h3 { margin: 0 0 .2rem; font-size: 1rem; }
    .topic-card-diffs { display: flex; flex-wrap: wrap; gap: .35rem; }
    .topic-chip-row { display: flex; flex-wrap: wrap; gap: .5rem; }
    .topic-chip {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .4rem .75rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: .85rem;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }
    .topic-chip:hover { border-color: var(--signal, #7c5cff); }
    .topic-chip.active { border-color: var(--signal, #7c5cff); background: rgba(124,92,255,.14); }

    .lc-progress-bar {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--lc-panel2);
      overflow: hidden;
    }

    .lc-progress-fill {
      height: 100%;
      background: var(--lc-orange);
      border-radius: 999px;
      transition: width .25s;
    }

    .lc-list-toolbar {
      display: flex;
      gap: .55rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .lc-search {
      flex: 1;
      min-width: 200px;
    }

    .lc-filter-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: .76rem;
      padding: .42rem .9rem;
      border-radius: 999px;
      border: 1px solid var(--lc-line2);
      background: var(--lc-panel2);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s, color .15s;
    }

    .lc-filter-chip:hover {
      color: var(--paper);
    }

    .lc-filter-chip.active {
      border-color: var(--lc-orange);
      color: var(--lc-orange);
    }

    .lc-table {
      width: 100%;
      border-collapse: collapse;
    }

    .lc-table thead th {
      text-align: left;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      padding: .7rem .9rem;
      border-bottom: 1px solid var(--lc-line2);
    }

    .lc-table tbody tr {
      cursor: pointer;
      transition: background .12s;
    }

    .lc-table tbody tr:hover {
      background: var(--lc-panel2);
    }

    .lc-table tbody tr:not(:last-child) td {
      border-bottom: 1px solid var(--lc-line2);
    }

    .lc-table tbody td {
      padding: .8rem .9rem;
      font-size: .88rem;
      vertical-align: middle;
    }

    .lc-status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .lc-status-dot.solved {
      background: var(--lc-easy);
      box-shadow: 0 0 0 3px rgba(0, 175, 155, .15);
    }

    .lc-status-dot.unsolved {
      background: var(--lc-line2);
    }

    .lc-title-cell {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 500;
    }

    .lc-tag-inline {
      font-size: .68rem;
      color: var(--muted);
      background: var(--lc-panel2);
      border: 1px solid var(--lc-line2);
      border-radius: 5px;
      padding: .1rem .45rem;
      margin-right: .3rem;
      display: inline-block;
      margin-top: .35rem;
    }

    @media (max-width:640px) {
      .lc-table thead {
        display: none;
      }

      .lc-table td:first-child {
        display: none;
      }
    }

    /* ================= Ambient background ================= */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-glow span {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .28;
      animation: drift 22s ease-in-out infinite alternate;
    }

    .bg-glow span:nth-child(1) {
      width: 520px;
      height: 520px;
      top: -180px;
      left: -140px;
      background: var(--signal);
    }

    .bg-glow span:nth-child(2) {
      width: 480px;
      height: 480px;
      top: 20%;
      right: -180px;
      background: var(--signal2);
      animation-duration: 26s;
      animation-delay: -6s;
    }

    .bg-glow span:nth-child(3) {
      width: 420px;
      height: 420px;
      bottom: -220px;
      left: 28%;
      background: var(--warn);
      opacity: .16;
      animation-duration: 30s;
      animation-delay: -12s;
    }

    @keyframes drift {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(40px, 50px) scale(1.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-glow span {
        animation: none;
      }
    }

    /* ================= Vibrant buttons ================= */
    .btn-primary {
      background: linear-gradient(135deg, var(--signal), #9b7dff 55%, var(--signal2));
      background-size: 160% 160%;
      color: #0b0d12;
      font-weight: 600;
      box-shadow: 0 6px 22px rgba(124, 92, 255, .28);
      transition: box-shadow .2s, transform .15s, background-position .4s;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 1;
      background-position: 100% 0;
      box-shadow: 0 8px 28px rgba(124, 92, 255, .42);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    /* ================= Auth (signup / login) ================= */
    .auth-shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 3.2rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .6);
    }

    @media (min-width:860px) {
      .auth-shell {
        grid-template-columns: 1fr 1.05fr;
        min-height: 560px;
      }
    }

    .auth-pitch {
      position: relative;
      padding: 2.6rem 2.4rem;
      background:
        radial-gradient(120% 140% at 0% 0%, rgba(124, 92, 255, .35), transparent 55%),
        radial-gradient(120% 140% at 100% 100%, rgba(55, 226, 196, .25), transparent 55%),
        var(--panel);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2rem;
      border-bottom: 1px solid var(--line);
    }

    @media (min-width:860px) {
      .auth-pitch {
        border-bottom: none;
        border-right: 1px solid var(--line);
      }
    }

    .auth-pitch .brand {
      font-size: 1.1rem;
    }

    .auth-pitch h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      line-height: 1.3;
      margin: 0;
    }

    .auth-perks {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: .9rem;
    }

    .auth-perks li {
      display: flex;
      align-items: flex-start;
      gap: .7rem;
      font-size: .86rem;
      color: var(--paper);
      line-height: 1.5;
    }

    .auth-perks .perk-icon {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 92, 255, .18);
      color: var(--signal2);
    }

    .auth-perks strong {
      color: var(--paper);
    }

    .auth-quote {
      font-size: .8rem;
      color: var(--muted);
      border-left: 2px solid var(--signal2);
      padding-left: .8rem;
      line-height: 1.6;
    }

    .auth-form-side {
      padding: 2.6rem 2.4rem;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .auth-form-side h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      margin: 0 0 .25rem;
    }

    .auth-form-side .sub {
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 1.6rem;
    }

    .field-pw-wrap {
      position: relative;
    }

    .field-pw-wrap input {
      width: 100%;
      padding-right: 2.6rem;
    }

    .pw-toggle {
      position: absolute;
      right: .5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .72rem;
      font-family: 'JetBrains Mono', monospace;
      padding: .3rem .4rem;
      letter-spacing: .02em;
    }

    .pw-toggle:hover {
      color: var(--paper);
    }

    .pw-strength {
      display: flex;
      gap: .3rem;
      margin-top: .45rem;
    }

    .pw-strength i {
      flex: 1;
      height: 4px;
      border-radius: 3px;
      background: var(--line);
      transition: background .2s;
    }

    .pw-strength-label {
      font-size: .72rem;
      color: var(--muted);
      margin-top: .35rem;
      display: block;
      min-height: 1em;
    }

    .field-ok input {
      border-color: rgba(55, 226, 196, .55);
    }

    .field-bad input {
      border-color: rgba(255, 138, 92, .6);
    }

    .field-hint {
      font-size: .74rem;
      color: var(--muted);
      margin-top: .3rem;
      display: block;
    }

    .field-hint.bad {
      color: var(--warn);
    }

    .form-err {
      display: flex;
      align-items: center;
      gap: .4rem;
      background: rgba(255, 138, 92, .1);
      border: 1px solid rgba(255, 138, 92, .3);
      border-radius: 8px;
      padding: .55rem .75rem;
      min-height: 0;
    }

    .form-err:empty {
      display: none;
      background: none;
      border: none;
      padding: 0;
    }

    /* ================= Dashboard ================= */
    .dash-hero {
      position: relative;
      border-radius: 16px;
      padding: 1.8rem 2rem;
      margin-bottom: 2rem;
      background:
        radial-gradient(120% 160% at 100% 0%, rgba(124, 92, 255, .28), transparent 60%),
        radial-gradient(120% 160% at 0% 100%, rgba(55, 226, 196, .18), transparent 55%),
        var(--panel);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .dash-hero h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.55rem;
      margin: 0 0 .35rem;
    }

    .dash-hero .wave {
      display: inline-block;
      animation: wave 2.2s ease-in-out infinite;
      transform-origin: 70% 70%;
    }

    @keyframes wave {

      0%,
      60%,
      100% {
        transform: rotate(0deg);
      }

      10%,
      30% {
        transform: rotate(14deg);
      }

      20% {
        transform: rotate(-8deg);
      }

      40% {
        transform: rotate(10deg);
      }
    }

    .dash-hero p {
      color: var(--muted);
      font-size: .9rem;
      margin: 0;
      max-width: 34rem;
    }

    .progress-ring-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .progress-ring-wrap .ring-label {
      font-size: .78rem;
      color: var(--muted);
    }

    .progress-ring-wrap .ring-label b {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      color: var(--paper);
      font-size: 1rem;
    }

    .ring-pct {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.1rem;
      fill: var(--paper);
    }

    .vibrant-stat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 1.6rem;
    }

    @media (min-width:640px) {
      .vibrant-stat-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .vstat {
      position: relative;
      padding: 1.3rem 1.4rem;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .vstat::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .55;
    }

    .vstat.c-signal::before {
      background: linear-gradient(135deg, rgba(124, 92, 255, .16), transparent 65%);
    }

    .vstat.c-teal::before {
      background: linear-gradient(135deg, rgba(55, 226, 196, .16), transparent 65%);
    }

    .vstat.c-warn::before {
      background: linear-gradient(135deg, rgba(255, 138, 92, .16), transparent 65%);
    }

    .vstat .vstat-top {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .8rem;
    }

    .vstat .vstat-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vstat.c-signal .vstat-icon {
      background: rgba(124, 92, 255, .18);
      color: var(--signal);
    }

    .vstat.c-teal .vstat-icon {
      background: rgba(55, 226, 196, .18);
      color: var(--signal2);
    }

    .vstat.c-warn .vstat-icon {
      background: rgba(255, 138, 92, .18);
      color: var(--warn);
    }

    .vstat p {
      position: relative;
      margin: 0;
    }

    .vstat .vstat-label {
      color: var(--muted);
      font-size: .82rem;
    }

    .vstat .vstat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.7rem;
      font-weight: 700;
      margin-top: .2rem;
    }

    .diff-breakdown {
      display: flex;
      gap: .35rem;
      margin-top: .7rem;
      position: relative;
    }

    .diff-breakdown .seg {
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .diff-breakdown .seg i {
      display: block;
      height: 100%;
      border-radius: 3px;
    }

    .diff-breakdown .seg.easy i {
      background: var(--lc-easy, var(--signal2));
    }

    .diff-breakdown .seg.medium i {
      background: var(--lc-medium, var(--warn));
    }

    .diff-breakdown .seg.hard i {
      background: var(--lc-hard, var(--warn));
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.4rem;
      margin-bottom: 2rem;
    }

    @media (min-width:860px) {
      .dash-grid {
        grid-template-columns: 1.3fr 1fr;
      }
    }

    .continue-card {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .9rem;
      justify-content: center;
    }

    .continue-card .eyebrow {
      margin: 0;
    }

    .continue-card h3 {
      margin: 0;
      font-size: 1.15rem;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .8rem;
    }

    .quick-actions a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
      text-align: center;
      padding: 1.1rem .6rem;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      cursor: pointer;
      transition: border-color .15s, transform .15s;
      font-size: .8rem;
    }

    .quick-actions a:hover {
      border-color: var(--signal);
      transform: translateY(-2px);
    }

    .quick-actions .qa-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(124, 92, 255, .15);
      color: var(--signal);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ================================================================
       Enterprise workspace polish
       ================================================================ */
    :root {
      --ink: #0b0f16;
      --panel: #121923;
      --panel-raised: #171f2b;
      --line: #263142;
      --line-soft: rgba(148, 163, 184, .14);
      --paper: #f1f5f9;
      --muted: #8d9aad;
      --signal: #8b7cff;
      --signal2: #38d6b3;

<body>
  <div class="bg-glow" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="nav"></div>
  <main id="app"></main>
  <footer class="site">CodeMentor AI · production-minded practice, execution, and feedback in one workspace</footer>
  <div id="toast-root"></div>

  <script>
    /* ============================================================
       CodeMentor-AI — single-file build
       Auth, code execution, saved programs, history, the practice-problem
       catalog, and problem-submission judging/progress all go through the
       CodeMentor backend API (Node/Express + MongoDB + Docker sandbox).
       The browser never decides pass/fail or "solved" — see
       POST /api/problems/:id/submit and getProblems()/getProgress() below.
       ============================================================ */

    // ---------- Backend API config ----------
    // Point this at your running backend (see the backend README for setup).
    // Backend URL configuration. For local development it uses localhost:5000.
    // For GitHub Pages/production, set the deployed HTTPS API URL below.
    const IS_LOCAL_DEV = ['localhost', '127.0.0.1'].includes(location.hostname) || location.protocol === 'file:';
    // The integrated frontend server proxies /api to the backend. Keeping the
    // origin relative fixes CORS, preview URLs, and production deployments.
    const BACKEND_URL = (window.CODEMENTOR_BACKEND_URL || (IS_LOCAL_DEV && location.protocol === 'file:' ? 'http://localhost:5000' : '')).replace(/\/$/, '');

    let AUTH_TOKEN = null; // JWT from the backend, kept in memory + persisted via storeSet

    async function apiFetch(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (AUTH_TOKEN) headers["Authorization"] = "Bearer " + AUTH_TOKEN;
      let response, data;
      try {
        response = await fetch(`${BACKEND_URL}${path}`, { ...options, headers });
      } catch (err) {
        throw new Error(`Could not reach the backend at ${BACKEND_URL} — is it running? (${err.message})`);
      }
      try { data = await response.json(); } catch (err) { data = {}; }
      if (!response.ok || data.success === false) {
        throw new Error(data.message || data.error || `Request failed (${response.status})`);
      }
      return data;
    }

    // ---------- Google Sign-In config ----------
    // The backend doesn't verify Google tokens server-side, so Google sign-in
    // stays a LOCAL-ONLY identity (stored via getUsers/saveUsers below) — no
    // backend JWT is issued for these accounts. Google users can still run
    // code (POST /api/execute works for guests too), they just won't get
    // server-side execution history saved against a backend account.
    //
    // To enable the real Google button: create an OAuth Client ID at
    // https://console.cloud.google.com/apis/credentials (type: Web application),
    // add this page's exact origin under "Authorized JavaScript origins", then
    // paste the client ID below.
    const GOOGLE_CLIENT_ID = "966155426799-09uv4g34njb844b8epk8q8kk7p7p1727.apps.googleusercontent.com";
    const GOOGLE_CONFIGURED = GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.startsWith("YOUR_");

    let googleScriptPromise = null;
    function loadGoogleScript() {
      if (googleScriptPromise) return googleScriptPromise;
      googleScriptPromise = new Promise((resolve, reject) => {
        if (window.google && window.google.accounts && window.google.accounts.id) return resolve();
        const s = document.createElement("script");
        s.src = "https://accounts.google.com/gsi/client";
        s.async = true; s.defer = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error("Could not load Google Sign-In."));
        document.head.appendChild(s);
      });
      return googleScriptPromise;
    }

    function decodeJwt(token) {
      const payload = token.split(".")[1];
      const json = decodeURIComponent(atob(payload.replace(/-/g, "+").replace(/_/g, "/")).split("").map(c =>
        "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join(""));
      return JSON.parse(json);
    }

    async function initGoogleButton() {
      const holder = document.getElementById("google-btn-holder");
      if (!holder) return;
      if (!GOOGLE_CONFIGURED) {
        holder.innerHTML = `<p class="muted" style="font-size:.78rem; line-height:1.5;">Google sign-in isn't configured yet — set <code class="mono">GOOGLE_CLIENT_ID</code> at the top of the script to a client ID from Google Cloud Console (with this page's origin as an authorized JavaScript origin) to turn this on.</p>`;
        return;
      }
      try {
        await loadGoogleScript();
        window.google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredential,
        });
        window.google.accounts.id.renderButton(holder, {
          theme: "filled_black", size: "large", shape: "pill", width: 320, text: "continue_with",
        });
      } catch (err) {
        holder.innerHTML = `<p class="warn" style="font-size:.8rem;">${escapeHtml(err.message || "Google Sign-In failed to load.")}</p>`;
      }
    }

    async function handleGoogleCredential(response) {
      try {
        const profile = decodeJwt(response.credential);
        const users = await getUsers();
        let user = users.find(u => u.googleId === profile.sub || u.email === profile.email);
        if (!user) {
          let username = (profile.email || "user").split("@")[0].replace(/[^a-zA-Z0-9_]/g, "");
          let candidate = username, n = 1;
          while (users.some(u => u.username === candidate)) candidate = username + (n++);
          user = { id: uid(), username: candidate, email: profile.email, googleId: profile.sub, name: profile.name, picture: profile.picture, provider: "google" };
          users.push(user);
          await saveUsers(users);
          toast(`Welcome, ${user.username}!`);
        } else {
          if (!user.googleId) { user.googleId = profile.sub; user.picture = profile.picture; await saveUsers(users); }
          toast(`Welcome back, ${user.username}!`);
        }
        // Local-only session (no backend JWT for Google accounts) — see note above.
        AUTH_TOKEN = null;
        await setSession({ userId: user.id });
        CURRENT_USER = user;
        go("dashboard");
      } catch (err) {
        toast(err.message || "Google sign-in failed.", true);
      }
    }

    // ---------- tiny in-memory fallback store ----------
    const memCache = {};
    async function storeGet(key, shared = false) {
      try {
        const r = await window.storage.get(key, shared);
        return r ? JSON.parse(r.value) : null;
      } catch (e) {
        return memCache[key] !== undefined ? memCache[key] : null;

      try { await window.storage.set(key, JSON.stringify(value), shared); } catch (e) { /* in-memory only */ }
    }
    async function getSession() {
      return await storeGet("codementor_session");
    }

    async function setSession(session) {
      await storeSet("codementor_session", session);
    }

    async function getUsers() {
      return (await storeGet("codementor_users")) || [];
    }

    // ---------- Toast ----------
    function toast(message, isError = false) {
      const root = document.getElementById("toast-root");
      if (!root) return;
      const el = document.createElement("div");
      el.className = "toast" + (isError ? " err" : "");
      el.textContent = message;
      root.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    // ---------- Problems + progress (backend-authoritative) ----------
    // Problem catalog and solved/attempt progress both live in MongoDB now
    // (Problem / ProblemProgress collections) — the browser only caches
    // what it fetches for this session, it is never the source of truth.
    // NOTE: Google-signed-in users don't get a backend JWT yet (see the
    // Google Sign-In config note above), so getProgress()/submitSolution()
    // return an empty/blocked state for them until backend Google auth
    // (a separate, not-yet-done phase) is wired up.
    async function getProblems() {
      const data = await apiFetch("/api/problems?limit=1000");
      return data.problems;
    }
    async function getProblemDetail(id) {
      const data = await apiFetch(`/api/problems/${encodeURIComponent(id)}`);
      return data; // { problem: {...}, progress?: {...} }
    }
    async function getProgress(userId) {
      if (!AUTH_TOKEN) return {}; // guest / Google-only session — no server progress available yet
      try {
        const data = await apiFetch("/api/problems/progress/me");
        return data.progress || {};
      } catch (err) {
        return {};
      }
    }

    // ---------- Code execution (backend) ----------
    async function runCode(code, language) {
      try {
        const headers = { "Content-Type": "application/json" };
        if (AUTH_TOKEN) headers["Authorization"] = "Bearer " + AUTH_TOKEN;
        const res = await fetch(`${BACKEND_URL}/api/execute`, {
          method: "POST",
          headers,
          body: JSON.stringify({ code, language }),
        });
        const data = await res.json();
        return {
          ok: data.success !== false && !data.error,
          stdout: data.stdout || data.output || "",
          stderr: data.stderr || data.error || "",
        };
      } catch (err) {
        return { ok: false, stdout: "", stderr: `Could not reach the backend at ${BACKEND_URL} — is it running? (${err.message})` };
      }
    }

    // ---------- Mentor (backend -> Gemini) ----------
    // PHASE 4 FIX: this used to call https://api.anthropic.com directly
    // from the browser with no API key attached (it only ever worked
    // inside Claude.ai's own sandbox, which injects that for you). On a
    // real deployment it would fail every time — no key to send, and
    // Anthropic's API doesn't accept anonymous cross-origin browser
    // calls anyway. The backend's /api/mentor/* routes (mentorController.js)
    // already existed and call Gemini server-side, with GEMINI_API_KEY
    // kept in the backend's .env only. These three functions now just
    // call that backend, same as every other API call in this file.
    async function explainCode(code, language, level) {
      const data = await apiFetch("/api/mentor/explain", {
        method: "POST",
        body: JSON.stringify({ code, language, level }),
      });
      return data.result;
    }

    async function findBug(code, language, runtimeOutput) {
      const data = await apiFetch("/api/mentor/find-bug", {
        method: "POST",
        body: JSON.stringify({ code, language, runtimeOutput }),
      });
      return { has_bug: data.has_bug, diagnosis: data.diagnosis, suggested_fix: data.suggested_fix };
    }

    // The mentor now needs the whole picture, not just "problem + code +
    // level": which judge status came back, which test failed, what the
    // runtime said, and what it has already told this learner. `payload` is
    // forwarded as-is to POST /api/mentor/hint.
    async function generateHint(payload) {
      const data = await apiFetch("/api/mentor/hint", {
        method: "POST",
        body: JSON.stringify(payload),
      });
      return {
        level: data.level || payload.hintLevel || 1,
        situation: data.situation || "no-run",
        badge: data.badge || "\u{1F4A1}",
        headline: data.headline || "Mentor hint",
        lead: data.lead || "",
        // `data.result` is the pre-upgrade response shape — kept as a fallback
        // so an older backend still renders something sensible.
        hint: data.hint || data.result || "",
        why: data.why || "",
      };
    }
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
      return Math.min(score, 4);

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const mode = e.target.dataset.mode;
      const errEl = document.getElementById("auth-err");
      const btn = document.getElementById("auth-submit");
      errEl.textContent = "";
      try {
        const email = document.getElementById("f-email").value.trim().toLowerCase();
        const password = document.getElementById("f-password").value;

        if (mode === "signup") {
          const password2 = document.getElementById("f-password2").value;
          if (password !== password2) {
            errEl.textContent = "Passwords don't match.";
            return;
          }
          if (password.length < 8) {
            errEl.textContent = "Password must be at least 8 characters.";
            return;
          }
        }

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span>${mode === "login" ? "Logging in…" : "Creating account…"}`;

        let data;
        if (mode === "signup") {
          const username = document.getElementById("f-username").value.trim();
          data = await apiFetch("/api/auth/register", {
            method: "POST",
            body: JSON.stringify({ name: username, email, password }),
          });
        } else {
          data = await apiFetch("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password }),
          });
        }

        AUTH_TOKEN = data.token;
        await setSession({ token: data.token });
        CURRENT_USER = { id: data.user.id, username: data.user.name, email: data.user.email, provider: "backend", createdAt: data.user.createdAt };
        toast(mode === "signup" ? `Welcome, ${CURRENT_USER.username}!` : `Welcome back, ${CURRENT_USER.username}!`);
        go("dashboard");
      } catch (err) {
        errEl.textContent = err.message || "Something went wrong.";
        btn.disabled = false;
        btn.textContent = mode === "login" ? "Log in" : "Sign up";
      }
    }

    async function doLogout() {
      if (AUTH_TOKEN) {
        apiFetch("/api/auth/logout", { method: "POST" }).catch(() => { }); // stateless JWT — best-effort only
      }
      AUTH_TOKEN = null;
      await setSession(null);
      CURRENT_USER = null;
      toast("Logged out.");
      go("");

    // ---------- Analytics dashboard ----------

    function renderTrendChart(trend) {
      const rows = Array.isArray(trend) && trend.length ? trend : Array.from({ length: 7 }, (_, i) => ({ label: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i], attempts: 0, executions: 0 }));
      const max = Math.max(1, ...rows.map((row) => Math.max(row.attempts || 0, row.executions || 0)));
      const width = 760, height = 230, left = 42, right = 18, top = 20, bottom = 34;
      const x = (i) => left + (i * (width - left - right)) / Math.max(1, rows.length - 1);
      const y = (value) => top + (height - top - bottom) * (1 - value / max);
      const line = (key) => rows.map((row, i) => `${i ? 'L' : 'M'} ${x(i).toFixed(1)} ${y(row[key] || 0).toFixed(1)}`).join(' ');
      const grid = [0, .5, 1].map((ratio) => `<line x1="${left}" y1="${y(max * ratio)}" x2="${width - right}" y2="${y(max * ratio)}" stroke="rgba(148,163,184,.12)"/><text x="${left - 10}" y="${y(max * ratio) + 4}" text-anchor="end" fill="#718096" font-size="10">${Math.round(max * ratio)}</text>`).join('');
      return `<div class="analytics-chart-wrap"><svg class="analytics-trend" viewBox="0 0 ${width} ${height}" role="img" aria-label="Seven day activity trend">${grid}<path d="${line('attempts')}" fill="none" stroke="#8b7cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="${line('executions')}" fill="none" stroke="#38d6b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${rows.map((row, i) => `<circle cx="${x(i)}" cy="${y(row.attempts || 0)}" r="4" fill="#8b7cff"/><circle cx="${x(i)}" cy="${y(row.executions || 0)}" r="4" fill="#38d6b3"/><text x="${x(i)}" y="${height - 8}" text-anchor="middle" fill="#718096" font-size="10">${escapeHtml(row.label || '')}</text>`).join('')}</svg><div class="analytics-legend"><span><i class="legend-dot purple"></i>Submissions</span><span><i class="legend-dot teal"></i>Executions</span></div></div>`;
    }

    function renderDifficultyChart(rows) {
      const data = rows?.length ? rows : [{ level: 'easy', solved: 0, total: 0 }, { level: 'medium', solved: 0, total: 0 }, { level: 'hard', solved: 0, total: 0 }];
      return `<div class="difficulty-chart">${data.map((row) => { const pct = row.total ? Math.round(row.solved / row.total * 100) : 0; return `<div class="difficulty-row"><div class="difficulty-label"><span class="diff-dot ${row.level}"></span><span>${row.level}</span><strong>${row.solved}/${row.total}</strong></div><div class="difficulty-track"><i class="${row.level}" style="width:${pct}%"></i></div><span class="difficulty-pct">${pct}%</span></div>`; }).join('')}</div>`;

        <div class="analytics-grid analytics-grid-main"><section class="analytics-card analytics-wide"><div class="analytics-card-head"><div><p class="eyebrow mono">ACTIVITY SIGNAL</p><h2>Weekly learning activity</h2></div><span class="analytics-period">Last 7 days</span></div>${renderTrendChart(analytics.trend)}</section><section class="analytics-card"><div class="analytics-card-head"><div><p class="eyebrow mono">COMPLETION MIX</p><h2>Difficulty progress</h2></div></div>${renderDifficultyChart(analytics.difficulty)}</section></div>
        <div class="analytics-grid analytics-grid-secondary"><section class="analytics-card"><div class="analytics-card-head"><div><p class="eyebrow mono">FOCUS AREAS</p><h2>Topic leaderboard</h2></div><a class="text-link" onclick="go('topics')">View all ${ICONS.arrowRight}</a></div>${renderTopicRows(analytics.topics)}</section><section class="analytics-card"><div class="analytics-card-head"><div><p class="eyebrow mono">RECENT EVENTS</p><h2>Activity feed</h2></div></div>${renderActivityRows(analytics.activity)}</section></div>
        <div class="analytics-next"><div><p class="eyebrow mono">RECOMMENDED NEXT</p><h2>${nextProblem ? escapeHtml(nextProblem.title) : 'Start your first problem'}</h2><p>${remaining ? `${remaining} problems remain in your learning queue. Keep your momentum with a focused session.` : 'You have completed the current catalog. Explore the editor to keep sharpening your skills.'}</p></div><a class="btn btn-primary" onclick="go('${nextProblem ? `practice/${nextProblem.id}` : 'editor'}')">${progress[nextProblem?.id]?.attempts ? 'Continue problem' : 'Start problem'} ${ICONS.arrowRight}</a></div>

`;

    function renderEditorResult() {
      const s = editorState;
      if (s.error) return `<p class="warn">${escapeHtml(s.error)}</p>`;

    // ---------- Practice list (LeetCode-style problem table) ----------
    let practiceState = { search: "", difficulty: "all", status: "all", tag: "all" };

    // ---------- Topics (browse problems by tag, LeetCode-style) ----------

    // One pass over the problem list -> per-tag totals, solved count and a
    // difficulty split. Used by both the dashboard card and the Topics page.
    function computeTagStats(problems, progress) {
      const map = new Map();
      problems.forEach(p => (p.tags || []).forEach(t => {
        if (!map.has(t)) map.set(t, { tag: t, total: 0, solved: 0, easy: 0, medium: 0, hard: 0 });
        const e = map.get(t);
        e.total += 1;
        if (progress[p.id] && progress[p.id].solved) e.solved += 1;
        if (e[p.difficulty] !== undefined) e[p.difficulty] += 1;
      }));
      return [...map.values()].sort((a, b) => b.total - a.total || a.tag.localeCompare(b.tag));
    }

    // "binary-search" -> "Binary Search"
    function prettyTag(t) {
      return String(t).replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());
