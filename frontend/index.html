        <input class="lc-search" id="lc-search" placeholder="Search by title or tag…" value="${escapeHtml(s.search)}" />
        ${statusFilters.map(([v, l]) => `<button class="lc-filter-chip ${s.status === v ? 'active' : ''}" data-status="${v}">${l}</button>`).join("")}
        ${diffFilters.map(([v, l]) => `<button class="lc-filter-chip ${s.difficulty === v ? 'active' : ''}" data-diff="${v}">${l}</button>`).join("")}
      </div>

      <div class="card" style="overflow:hidden;">
        <table class="lc-table">
          <thead><tr><th style="width:40px;"></th><th>Title</th><th style="width:110px;">Difficulty</th></tr></thead>
          <tbody>
            ${filtered.length ? filtered.map(p => {
        const idx = problems.indexOf(p);
        const solved = !!(progress[p.id] && progress[p.id].solved);
        return `
              <tr onclick="go('practice/${p.id}')">
                <td><span class="lc-status-dot ${solved ? 'solved' : 'unsolved'}" title="${solved ? 'Solved' : 'Not solved'}"></span></td>
                <td>
                  <div class="lc-title-cell">
                    <span class="mono muted" style="font-size:.78rem;">${idx + 1}.</span>
                    <span>${escapeHtml(p.title)}</span>
                  </div>
                  <div>${p.tags.map(t => `<span class="lc-tag-inline">${escapeHtml(t)}</span>`).join("")}</div>
                </td>
                <td><span class="lc-pill ${p.difficulty}">${p.difficulty}</span></td>
              </tr>`;
      }).join("") : `<tr><td colspan="3" class="muted" style="padding:2rem; text-align:center;">No problems match your filters.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;

      const searchEl = document.getElementById("lc-search");
      searchEl.addEventListener("input", (e) => {
        practiceState.search = e.target.value;
        renderPracticeList(app, problems, progress);
        const el = document.getElementById("lc-search");
        el.focus();
        el.selectionStart = el.selectionEnd = el.value.length;
      });
      document.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", () => {
        practiceState.status = b.dataset.status; renderPracticeList(app, problems, progress);
      }));
      document.querySelectorAll("[data-diff]").forEach(b => b.addEventListener("click", () => {
        practiceState.difficulty = b.dataset.diff; renderPracticeList(app, problems, progress);
      }));
      document.querySelectorAll("[data-tagfilter]").forEach(b => b.addEventListener("click", () => {
        practiceState.tag = b.dataset.tagfilter;
        renderPracticeList(app, problems, progress);
      }));
    }

    // ============================================================
    // Problem workspace — LeetCode-style split view:
    // left = description / mentor hint, right = code editor (top)
    // + testcase / result console (bottom), with draggable splitters.
    // ============================================================
    let problemState = {};

    function ensureProblemState(problem) {
      if (!problemState[problem.id]) {
        problemState[problem.id] = {
          code: problem.starter,
          running: false,
          results: null,
          hint: "",                 // legacy plain-text hint (kept for compat)
          hintData: null,           // last full mentor response
          hintHistory: [],          // [{level, hint, at}] — sent back so hints never repeat
          hintNotice: false,        // "mentor noticed something" badge after a failed run
          hintTakenSinceRun: false, // drives automatic level escalation
          whyOpen: false,
          hintLoading: false,
          hintLevel: 1,
          leftTab: "description",
          consoleTab: "testcase",
          activeCase: 0,
          leftWidth: 42,     // % of lc-body width
          editorHeight: 60,  // % of lc-right height
        };
      }
      return problemState[problem.id];
    }

    async function renderProblemDetail(app, id) {
      // The list endpoint only carries lightweight metadata (used for the
      // "3 of 956" numbering below) — full description/starter/examples
      // come from the detail endpoint, which also includes this user's
      // own progress for the problem when logged in.
      const [problems, detail] = await Promise.all([
        getProblems(),
        getProblemDetail(id).catch(() => null),
      ]);
      if (!detail || !detail.problem) { app.innerHTML = `<div class="page container"><p>Problem not found. <a class="signal" onclick="go('practice')">Back to practice</a></p></div>`; return; }
      const problem = detail.problem;
      const idx = problems.findIndex(p => p.id === id);
      const s = ensureProblemState(problem);

      app.innerHTML = `
  <div class="lc-shell">
    <div class="lc-topbar">
      <div class="lc-title">
        <span class="lc-back" onclick="go('practice')">&larr; Practice</span>
        <span>${idx + 1}. ${escapeHtml(problem.title)}</span>
        <span class="lc-pill ${problem.difficulty}">${problem.difficulty}</span>
      </div>
      <div class="lc-run-row">
        <select id="pd-hint-level" class="lc-btn" style="cursor:pointer;">
          <option value="1" ${s.hintLevel === 1 ? "selected" : ""}>Hint · nudge</option>
          <option value="2" ${s.hintLevel === 2 ? "selected" : ""}>Hint · strategy</option>
          <option value="3" ${s.hintLevel === 3 ? "selected" : ""}>Hint · near-solution</option>
        </select>
        <button class="lc-btn" id="pd-hint" ${s.hintLoading ? "disabled" : ""}>${s.hintLoading ? "Thinking…" : "💡 Hint"}</button>
        <button class="lc-btn" id="pd-run" ${s.running ? "disabled" : ""}>${s.running ? `<span class="spinner"></span>` : "▶"} Run</button>
        <button class="lc-btn submit" id="pd-submit" ${s.running ? "disabled" : ""}>Submit</button>
      </div>
    </div>
    <div class="lc-body" id="lc-body">
      <div class="card lc-pane lc-left" id="lc-left" style="flex:0 0 ${s.leftWidth}%;">
        <div class="lc-tabbar">
          <button class="lc-tab ${s.leftTab === 'description' ? 'active' : ''}" data-lefttab="description">Description</button>
          <button class="lc-tab ${s.leftTab === 'hint' ? 'active' : ''}" data-lefttab="hint">Mentor Hint</button>
        </div>
        <div class="lc-scroll">${s.leftTab === 'description' ? renderProblemDescription(problem) : renderHintPanel(s)}</div>
      </div>
      <div class="lc-splitter-v" id="lc-splitter-v"></div>
      <div class="lc-pane lc-right" id="lc-right" style="flex:1;">
        <div class="card lc-pane" id="lc-editor-pane" style="flex:0 0 ${s.editorHeight}%;">
          <div class="lc-editor-header">
            <span class="muted mono" style="font-size:.75rem;">${problem.fnName}.py</span>
            <span class="muted mono" style="font-size:.72rem;">Python3</span>
          </div>
          <textarea class="lc-code-input" id="pd-code" spellcheck="false">${escapeHtml(s.code)}</textarea>
        </div>
        <div class="lc-splitter-h" id="lc-splitter-h"></div>
        <div class="card lc-pane" id="lc-console-pane" style="flex:1;">
          <div class="lc-console-tabs">
            <button class="lc-tab ${s.consoleTab === 'testcase' ? 'active' : ''}" data-consoletab="testcase">Testcase</button>
            <button class="lc-tab ${s.consoleTab === 'result' ? 'active' : ''} ${s.results && s.results.status !== 'Accepted' ? 'warn' : ''}" data-consoletab="result">Result</button>
          </div>
          <div style="flex:1; overflow-y:auto;" id="lc-console-body">${renderConsoleBody(problem, s)}</div>
        </div>
      </div>
    </div>
  </div>`;

      document.getElementById("pd-code").addEventListener("input", e => { s.code = e.target.value; });
      document.getElementById("pd-hint-level").addEventListener("change", e => { s.hintLevel = parseInt(e.target.value, 10); });
      document.getElementById("pd-run").addEventListener("click", () => runProblemCode(app, problem, s, false));
      document.getElementById("pd-submit").addEventListener("click", () => runProblemCode(app, problem, s, true));
      document.getElementById("pd-hint").addEventListener("click", () => getProblemHint(app, problem, s));
      const whyBtn = document.getElementById("pd-why");
      if (whyBtn) whyBtn.addEventListener("click", () => { s.whyOpen = !s.whyOpen; renderProblemDetail(app, id); });
      const noticeBtn = document.getElementById("pd-hint-notice");
      if (noticeBtn) noticeBtn.addEventListener("click", () => getProblemHint(app, problem, s));
      document.querySelectorAll("[data-lefttab]").forEach(b => b.addEventListener("click", () => { s.leftTab = b.dataset.lefttab; renderProblemDetail(app, id); }));
      document.querySelectorAll("[data-consoletab]").forEach(b => b.addEventListener("click", () => { s.consoleTab = b.dataset.consoletab; renderProblemDetail(app, id); }));
      document.querySelectorAll("[data-case]").forEach(b => b.addEventListener("click", () => { s.activeCase = parseInt(b.dataset.case, 10); renderProblemDetail(app, id); }));

      attachSplitterDrag(document.getElementById("lc-splitter-v"), document.getElementById("lc-body"), "horizontal", (pct) => {
        s.leftWidth = pct;
        document.getElementById("lc-left").style.flexBasis = pct + "%";
      });
      attachSplitterDrag(document.getElementById("lc-splitter-h"), document.getElementById("lc-right"), "vertical", (pct) => {
        s.editorHeight = pct;
        document.getElementById("lc-editor-pane").style.flexBasis = pct + "%";
      });
    }

    function renderProblemDescription(problem) {
      return `
    <h2>${escapeHtml(problem.title)}</h2>
    <p>${escapeHtml(problem.description)}</p>
    <div class="lc-tag-row">${problem.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
  `;
    }

    function renderHintPanel(s) {
      if (s.hintLoading) return `<p class="muted"><span class="spinner"></span>Consulting the mentor…</p>`;
      const h = s.hintData;
      if (!h) return `<p class="muted">Stuck? Hit \u{1F4A1} Hint. If you've already run your code, the mentor reads the judge result and the failing test first — so the hint points at <em>your</em> bug instead of giving a generic tip.</p>`;
      const sep = `<div style="border-top:1px solid currentColor;opacity:.15;margin:.9rem 0;"></div>`;
      const history = s.hintHistory || [];
      return `
    <p class="lc-result-summary">${h.badge} ${escapeHtml(h.headline)} <span class="muted" style="font-weight:400;">· level ${h.level}</span></p>
    ${h.lead ? `<p class="muted" style="margin-top:-.35rem;">${escapeHtml(h.lead)}</p>` : ""}
    <p style="white-space:pre-wrap;">${escapeHtml(h.hint)}</p>
    ${h.why ? `${sep}<button class="lc-btn" id="pd-why">${s.whyOpen ? "Hide explanation" : "Why this hint?"}</button>${s.whyOpen ? `<p class="muted" style="white-space:pre-wrap;margin-top:.6rem;">${escapeHtml(h.why)}</p>` : ""}` : ""}
    ${history.length > 1 ? `${sep}<div class="lc-case-label">Earlier hints</div><ol class="muted" style="padding-left:1.1rem;margin:.4rem 0 0;">${history.slice(0, -1).map(x => `<li style="margin-bottom:.35rem;">L${x.level} · ${escapeHtml(x.hint)}</li>`).join("")}</ol>` : ""}
    ${sep}<p class="muted" style="font-size:.75rem;">Next hint: level ${Math.min(3, s.hintLevel || 1)}. Edit your code and run again — if it still fails, the mentor steps up a level on its own.</p>
  `;
    }

    function renderConsoleBody(problem, s) {
      const examples = problem.examples || [];
      if (s.consoleTab === "testcase") {
        if (!examples.length) {
          return `<p class="muted" style="padding:1rem;">This problem doesn't have example test cases yet.</p>`;
        }
        const t = examples[s.activeCase] || examples[0];
        return `
      <div class="lc-case-row">
        ${examples.map((_, i) => `<button class="lc-case-btn ${s.activeCase === i ? 'active' : ''}" data-case="${i}">Case ${i + 1}</button>`).join("")}
      </div>
      <div class="lc-case-body">
        <div class="lc-case-label">Input</div>
        <div class="lc-case-value">${escapeHtml(t.input)}</div>
      </div>
    `;
      }
      // result tab — s.results is the JSON the backend judge returned:
      // { status, passed, total, executionTime, error, cases } (see
      // POST /api/problems/:id/submit). The backend decides `status`;
      // this just renders it.
      if (s.running) return `<p class="muted" style="padding:1rem;"><span class="spinner"></span>Running against ${examples.length || problem.hiddenTestCount || ''} test case(s)…</p>`;
      if (!s.results) return `<p class="muted" style="padding:1rem;">Run or Submit to see results here.</p>`;
      if (s.results.status === "No Judge Tests") {
        return `<p class="lc-result-summary warn">⚠ No judge tests available for this problem yet — it can't be graded.</p>`;
      }
      const accepted = s.results.status === "Accepted";
      const cases = s.results.cases || [];
      return `
    <p class="lc-result-summary ${accepted ? 'signal2' : 'warn'}">${accepted ? "✓" : "✗"} ${escapeHtml(s.results.status)} <span class="muted" style="font-weight:400;">(${s.results.passed}/${s.results.total})</span></p>
    ${s.hintNotice ? `<p class="muted" style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:0 1rem;">\u{1F4A1} The mentor noticed something in this run. <button class="lc-btn" id="pd-hint-notice">View hint</button></p>` : ""}
    <div class="lc-case-row">
      ${cases.map((r, i) => `<button class="lc-case-btn ${s.activeCase === i ? 'active' : ''} ${r.pass ? '' : 'warn'}" data-case="${i}">Case ${i + 1} ${r.pass ? '✓' : '✗'}</button>`).join("")}
    </div>
    <div class="lc-case-body">
      ${renderCaseResult(problem, s)}
    </div>
  `;
    }

    function renderCaseResult(problem, s) {
      const cases = s.results.cases || [];
      const i = s.activeCase < cases.length ? s.activeCase : 0;
      const r = cases[i];
      if (!r) return "";
      // Submitted (graded) runs only ever get {pass, error} per case — the
      // hidden test's input/expected output are stripped server-side and
      // never sent to the browser at all (see problemController.submitSolution).
      const isRedacted = r.actual === undefined && r.expected === undefined;
      return `
    ${r.input !== undefined ? `<div class="lc-case-label">Input</div><div class="lc-case-value">${escapeHtml(r.input)}</div>` : ""}
    ${isRedacted
        ? `<p class="muted">This is a hidden judge test — its input and expected output aren't shown.</p>`
        : `
    <div class="lc-case-label">Output</div>
    <div class="lc-case-value">${escapeHtml(r.actual == null ? "(no output)" : r.actual)}</div>
    <div class="lc-case-label">Expected</div>
    <div class="lc-case-value">${escapeHtml(r.expected)}</div>
    `}
    ${r.error ? `<div class="lc-case-label warn">Error</div><div class="lc-case-value">${escapeHtml(r.error)}</div>` : ""}
  `;
    }

    async function runProblemCode(app, problem, s, isSubmit) {
      s.running = true; s.results = null; s.consoleTab = "result"; s.activeCase = 0;
      renderProblemDetail(app, problem.id);

      try {
        // The backend is the only thing that ever decides pass/fail now —
        // see PHASE 3: POST /api/problems/:id/submit runs the code in the
        // Docker sandbox and judges it server-side. mode:"run" grades
        // against the public examples and never touches progress; only
        // mode:"submit" (hidden tests) can mark the problem solved.
        const data = await apiFetch(`/api/problems/${encodeURIComponent(problem.id)}/submit`, {
          method: "POST",
          body: JSON.stringify({ code: s.code, language: "python", mode: isSubmit ? "submit" : "run" }),
        });
        s.results = data;
        s.running = false;

        // Auto-hint + automatic escalation. A failed run always offers a hint
        // inline; and if they already took a hint at this level and it is
        // STILL failing, the next one moves up a level instead of repeating
        // the same nudge.
        if (data.status === "Accepted") {
          s.hintNotice = false;
          s.hintTakenSinceRun = false;
        } else {
          s.hintNotice = true;
          if (s.hintTakenSinceRun) {
            s.hintLevel = Math.min(3, (s.hintLevel || 1) + 1);
            s.hintTakenSinceRun = false;
          }
        }

        if (isSubmit) {
          const accepted = data.status === "Accepted";
          if (data.status === "No Judge Tests") {
            toast("This problem doesn't have judge tests yet, so it can't be marked solved.", true);
          } else {
            toast(accepted ? `${problem.title} solved! 🎉` : `${data.status} — check the failing tests.`, !accepted);
          }
        } else {
          toast(data.status === "Accepted" ? "All sample tests passed." : `${data.status} on the sample tests.`, data.status !== "Accepted");
        }
      } catch (err) {
        s.running = false;
        s.results = { status: "Runtime Error", passed: 0, total: 0, cases: [], error: err.message };
        toast(err.message || "Couldn't reach the judge.", true);
      }

      renderProblemDetail(app, problem.id);
    }

    async function getProblemHint(app, problem, s) {
      s.hintLoading = true; s.leftTab = "hint"; s.whyOpen = false;
      renderProblemDetail(app, problem.id);
      try {
        // Everything the judge told us goes to the mentor. In submit mode the
        // failing case is already redacted server-side ({pass, error} only),
        // so we forward whatever survived redaction and the backend instructs
        // the model not to invent the rest.
        const r = s.results || null;
        const failedCase = r && Array.isArray(r.cases) ? (r.cases.find(c => !c.pass) || null) : null;
        const data = await generateHint({
          problemId: problem.id,
          problemTitle: problem.title,
          problemDescription: problem.description,
          tags: problem.tags || [],
          code: s.code,
          language: "python",
          hintLevel: s.hintLevel,
          status: r ? r.status : null,
          passed: r ? r.passed : null,
          total: r ? r.total : null,
          failedCase,
          runtimeOutput: r ? r.error : null,
          previousHints: (s.hintHistory || []).map(x => x.hint),
        });
        s.hintData = data;
        s.hint = data.hint;
        s.hintHistory = (s.hintHistory || []).concat([{ level: data.level, hint: data.hint, at: Date.now() }]);
        s.hintNotice = false;
        s.hintTakenSinceRun = true;
        // ProblemProgress.hintsUsed is incremented server-side inside
        // POST /api/mentor/hint — it needs the authenticated user anyway.
      } catch (err) {
        toast(err.message || "Couldn't reach the mentor.", true);
      } finally {
        s.hintLoading = false;
        renderProblemDetail(app, problem.id);
      }
    }

    // Lightweight drag-to-resize splitter. Updates the DOM directly during
    // drag (no re-render) so dragging stays smooth, and commits the final
    // percentage into state via onChange so it survives re-renders.
    function attachSplitterDrag(handle, container, axis, onChange) {
      if (!handle || !container) return;
      handle.addEventListener("mousedown", (e) => {
        e.preventDefault();
        handle.classList.add("dragging");
        const rect = container.getBoundingClientRect();
        function move(ev) {
          let pct = axis === "horizontal"
            ? ((ev.clientX - rect.left) / rect.width) * 100
            : ((ev.clientY - rect.top) / rect.height) * 100;
          pct = Math.max(20, Math.min(80, pct));
          onChange(pct);
        }
        function up() {
          handle.classList.remove("dragging");
          document.removeEventListener("mousemove", move);
          document.removeEventListener("mouseup", up);
        }
        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", up);
      });
    }

    // ---------- Profile ----------
    function renderProfile(app) {
      app.innerHTML = `
  <div class="page container-sm">
    <h1>Profile</h1>
    <div class="card" style="padding:1.4rem; margin:1.6rem 0;">
      ${CURRENT_USER.picture ? `<img src="${CURRENT_USER.picture}" alt="" style="width:56px; height:56px; border-radius:50%; margin-bottom:1rem; border:1px solid var(--line);" referrerpolicy="no-referrer" />` : ""}
      <div class="kv"><div class="k">Username</div><div class="v">${escapeHtml(CURRENT_USER.username)}</div></div>
      <div class="kv"><div class="k">Email</div><div class="v">${escapeHtml(CURRENT_USER.email)}</div></div>
      <div class="kv"><div class="k">Signed in with</div><div class="v">${CURRENT_USER.provider === "google" ? "Google (local)" : "Email & password (backend)"}</div></div>
      <div class="kv" style="margin-bottom:0;"><div class="k">User ID</div><div class="v muted" style="font-size:.75rem;">${CURRENT_USER.id}</div></div>
    </div>
    <button class="btn btn-danger-ghost" onclick="doLogout()">Log out</button>
  </div>`;
    }

    // ---------- global handlers ----------
    function attachGlobalHandlers() {
      const form = document.getElementById("auth-form");
      if (form) {
        form.addEventListener("submit", handleAuthSubmit);
        initAuthFormExtras();
      }
      const googleHolder = document.getElementById("google-btn-holder");
      if (googleHolder) {
        if (typeof initGoogleButton === "function") {
          initGoogleButton();
        } else {
          googleHolder.innerHTML = `<p class="muted" style="font-size:.78rem;">Google sign-in isn't wired up in this build — use email &amp; password below.</p>`;
        }
      }
    }

    boot();
  </script>
</body>

</html>
